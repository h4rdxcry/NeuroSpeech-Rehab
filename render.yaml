# NeuroSpeech Rehab - Render Blueprint for 24/7 Free Cloud Backend
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: neurospeech-backend
    runtime: python
    plan: free
    region: oregon
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements-prod.txt"
    startCommand: "uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # User enters their Supabase connection string during setup
      - key: JWT_SECRET
        generateValue: true # Render generates a secure random 256-bit key
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://neuro-speech-rehab.vercel.app,http://localhost:5173,http://localhost:3000"
      - key: PYTHON_VERSION
        value: "3.11.9"
