[project]
name = "ml_training"
version = "0.1.0"
description = "SLR127 Wav2Vec2 Data Pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchaudio",
    "sqlalchemy",
    "pydantic-settings",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "bcrypt",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "C4", "PT"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ['py311']